[package]
name = "mpsm"
version = "0.1.0"
edition = "2021"
description = "MPSM (Multipurpose System Manager), a cross-platform system monitor and manager written in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
sysinfo = "0.32"
battery = "0.7"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
