[package]
name = "ferrum-monitor"
version = "0.1.0"
edition = "2021"
description = "Cross-platform (Linux / macOS / Windows) task manager, disk manager, storage analyser, spec viewer and startup manager written in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
sysinfo = "0.32"
battery = "0.7"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
